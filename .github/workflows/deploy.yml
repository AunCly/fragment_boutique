name: Déploiement OVH

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

# Évite deux déploiements simultanés sur le serveur
concurrency:
  group: deploy-ovh
  cancel-in-progress: false

env:
  # Dossier du projet, relatif au home du compte OVH (ex: /homez.123/login/www)
  # Le "Dossier racine" du domaine dans le manager OVH doit pointer sur : www/current/public
  PROJECT_DIR: www
  KEEP_RELEASE: 3
  # Binaire PHP CLI d'OVH (la commande "php" par défaut en SSH n'est pas forcément en 8.4)
  PHP_BIN: /usr/local/php8.4/bin/php

jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Définition du dossier de la release
        run: echo "RELEASE_DATE=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      # Installation de PHP (même version que l'hébergement)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # Clone du dépôt
      - uses: actions/checkout@v4

      # Installation de Composer et des dépendances. Si le cache existe, on l'utilise
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction

      # Installation de Node.js et build des assets Vite (Node n'est pas disponible sur le mutualisé OVH)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install npm dependencies (builder)
        run: npm ci
        working-directory: resources/builder

      - name: Build assets (builder)
        run: npm run build
        working-directory: resources/builder

      # Connexion SSH par utilisateur / mot de passe via sshpass
      - name: Installation de sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      # Copie du fichier environnement
      - name: Copie du fichier environnement
        run: |
          cp .github/envs/.production .env

      # Ajout des secrets dans le fichier environnement
      - name: Ajout des secrets dans le fichier environnement
        run: |
          set -e
          echo '' >> .env
          echo 'APP_URL="${{ secrets.APP_URL }}"' >> .env
          echo 'APP_KEY="${{ secrets.APP_KEY }}"' >> .env
          echo 'DB_HOST="${{ secrets.DB_HOST }}"' >> .env
          echo 'DB_DATABASE="${{ secrets.DB_DATABASE }}"' >> .env
          echo 'DB_USERNAME="${{ secrets.DB_USERNAME }}"' >> .env
          echo 'DB_PASSWORD="${{ secrets.DB_PASSWORD }}"' >> .env

          echo 'SHOPIFY_STORE_DOMAIN="${{ secrets.SHOPIFY_STORE_DOMAIN }}"' >> .env
          echo 'SHOPIFY_CLIENT_ID="${{ secrets.SHOPIFY_CLIENT_ID }}"' >> .env
          echo 'SHOPIFY_CLIENT_SECRET="${{ secrets.SHOPIFY_CLIENT_SECRET }}"' >> .env
          echo 'SHOPIFY_STOREFRONT_TOKEN="${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}"' >> .env

      # Suppression des caches
      - name: Nettoyage des caches
        run: php artisan optimize:clear

      # Écriture du fichier .htpasswd sur le serveur (optionnel : si le secret HTPASSWD est vide,
      # la protection par mot de passe est retirée du .htaccess pendant le déploiement)
      - name: Écriture du fichier .htpasswd sur le serveur
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          HTPASSWD_CONTENT: ${{ secrets.HTPASSWD }}
        run: |
          if [ -n "$HTPASSWD_CONTENT" ]; then
            echo "$HTPASSWD_CONTENT" | sshpass -e ssh -T -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "mkdir -p ${{ env.PROJECT_DIR }} && cat > ${{ env.PROJECT_DIR }}/.htpasswd && chmod 644 ${{ env.PROJECT_DIR }}/.htpasswd"
          fi

      # Copie du code source sur le serveur distant via rsync
      - name: Copie du code source sur le serveur distant via rsync
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          rsync -az --delete \
            --rsync-path "mkdir -p ${{ env.PROJECT_DIR }}/releases && rsync" \
            --exclude '.git' --exclude '.github' --exclude '.docker' --exclude '.ai' --exclude '.idea' --exclude '.claude' \
            --exclude 'node_modules' --exclude 'tests' --exclude 'public/storage' --exclude 'public/hot' \
            -e "sshpass -e ssh -T -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.PROJECT_DIR }}/releases/${{ env.RELEASE_DATE }}/

      # Activation de la release : stockage partagé, liens symboliques, migrations, cache, bascule de "current"
      - name: Activation de la release sur le serveur
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          HTPASSWD_CONTENT: ${{ secrets.HTPASSWD }}
        run: |
          HAS_HTPASSWD=$([ -n "$HTPASSWD_CONTENT" ] && echo 1 || echo 0)
          sshpass -e ssh -T -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<EOF
          set -e
          PHP="${{ env.PHP_BIN }}"
          PROJECT="\$HOME/${{ env.PROJECT_DIR }}"
          RELEASE="\$PROJECT/releases/${{ env.RELEASE_DATE }}"

          trap 'if [ -d "\$PROJECT/current" ]; then cd "\$PROJECT/current" && \$PHP artisan up; fi' ERR

          # Version PHP du site web (lue par OVH à la racine de l'hébergement)
          cat > "\$HOME/.ovhconfig" <<OVHCONFIG
          app.engine=php
          app.engine.version=8.4
          http.firewall=none
          environment=production
          container.image=stable64
          OVHCONFIG

          if [ -d "\$PROJECT/current" ]; then
            echo "Mise en maintenance du site"
            cd "\$PROJECT/current" && \$PHP artisan down || true
          fi

          if [ ! -d "\$PROJECT/storage" ]; then
            echo "Création du dossier storage partagé"
            cp -R "\$RELEASE/storage" "\$PROJECT/storage"
          fi
          mkdir -p "\$PROJECT/catalogue"

          echo "Création des liens symboliques"
          rm -rf "\$RELEASE/storage"
          ln -s "\$PROJECT/storage" "\$RELEASE/storage"
          ln -sfn "\$PROJECT/storage/app/public" "\$RELEASE/public/storage"
          ln -sfn "\$PROJECT/catalogue" "\$RELEASE/public/catalogue"

          # Chemin absolu du .htpasswd (dépend du home OVH, ex: /homez.123/login)
          if [ "$HAS_HTPASSWD" = "1" ]; then
            sed -i "s#^AuthUserFile .*#AuthUserFile \$PROJECT/.htpasswd#" "\$RELEASE/public/.htaccess"
          else
            sed -i '/^AuthType\|^AuthName\|^AuthUserFile\|^Require valid-user/d' "\$RELEASE/public/.htaccess"
          fi

          cd "\$RELEASE"
          echo "Exécution des migrations"
          \$PHP artisan migrate --force
          echo "Mise en cache de la configuration, des routes et des vues"
          \$PHP artisan optimize

          ln -sfn "\$RELEASE" "\$PROJECT/current"

          echo "Suppression des vieilles releases"
          ls -dt "\$PROJECT"/releases/* | tail -n +\$(( ${{ env.KEEP_RELEASE }} + 1 )) | xargs rm -rf

          echo "Le site est de nouveau accessible"
          cd "\$PROJECT/current" && \$PHP artisan up
          EOF
